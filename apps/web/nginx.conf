# Frame and referrer policy, keyed on the request path.
#
# Mirrors src/worker.ts, which does the same job on the Cloudflare path — keep
# the two in step. The app refuses framing everywhere; /share/ is the one
# exception, because embedding a public chart is a feature. Which share links
# may actually be framed is the API's call (`embeddable`), enforced by the page.
# This layer only knows the path.
#
# A `map` rather than per-location `add_header`: the SPA fallback is an internal
# redirect to /index.html, and nginx applies add_header from the location the
# request *ends* in, so a directive on `location /share/` would be dropped for
# exactly the routes it exists to cover. `$uri` is the pre-redirect path, and an
# empty value makes nginx skip the header entirely.
map $uri $maple_csp {
    default    "frame-ancestors 'none'";
    ~^/share/  "";
    ~^/share$  "";
}

map $uri $maple_xfo {
    default    "DENY";
    ~^/share/  "";
    ~^/share$  "";
}

# The share token is in the URL, so no-referrer is what stops it reaching a
# third party in a Referer header.
map $uri $maple_referrer_policy {
    default    "";
    ~^/share/  "no-referrer";
    ~^/share$  "no-referrer";
}

server {
    listen 80;

    add_header Content-Security-Policy $maple_csp always;
    add_header X-Frame-Options $maple_xfo always;
    add_header Referrer-Policy $maple_referrer_policy always;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
