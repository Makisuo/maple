<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>Maple</title>

		<meta
			name="description"
			content="Open-source observability platform. Traces, logs, and metrics for your distributed systems."
		/>
		<meta property="og:title" content="Maple" />
		<meta
			property="og:description"
			content="Open-source observability platform. Traces, logs, and metrics for your distributed systems."
		/>
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Maple" />
		<meta
			name="twitter:description"
			content="Open-source observability platform. Traces, logs, and metrics for your distributed systems."
		/>
		<meta name="twitter:image" content="/og-image.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#171410" />

		<!-- Web Analytics paints one favicon per referrer/site row, so a populated
		     breakdown fires ~50 requests at this host at once. Without this they all
		     queue behind the same cold TLS handshake. -->
		<link rel="preconnect" href="https://favicon.maple.dev" />

		<!-- Apply the saved theme before first paint to avoid a flash of the wrong theme.
		     Must stay in sync with the theme store in @maple/ui/hooks/use-theme
		     (storage key "maple-theme", `light`/`dark` class on <html>, default "dark"). -->
		<script>
			;(() => {
				try {
					let theme = localStorage.getItem("maple-theme") || "dark"
					if (theme !== "light" && theme !== "dark") theme = "dark"
					const root = document.documentElement
					root.classList.remove("light", "dark")
					root.classList.add(theme)
					root.style.colorScheme = theme
				} catch {}
			})()
		</script>
	</head>
	<body>
		<!-- Pre-paint cold-boot splash. The app is client-rendered (createRoot,
		     no SSR) and styles.css/Geist load with the JS bundle, so the first
		     paint would otherwise be a blank #app. This self-contained, JS-free
		     copy of <BootSplash /> (apps/web/src/components/boot-splash.tsx)
		     paints immediately, themed via the html.dark/.light class the head
		     script already set. It lives inside #app, so React's first commit
		     replaces it with the identical-looking React splash — no blank
		     frame, no flash. Keep it in visual sync with boot-splash.tsx. -->
		<div id="app">
			<div class="maple-bootshell" role="status" aria-label="Loading Maple">
				<style>
					.maple-bootshell {
						--boot-bg: oklch(0.207 0.008 67);
						--boot-amber: oklch(0.714 0.154 59);
						--boot-muted: oklch(0.603 0.023 72);
						position: fixed;
						inset: 0;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						gap: 24px;
						background: var(--boot-bg);
					}
					html.light .maple-bootshell {
						--boot-bg: #fff;
						--boot-amber: oklch(0.66 0.16 59);
						--boot-muted: oklch(0.552 0.016 285.938);
					}
					.maple-bootshell__mark {
						display: flex;
						width: 44px;
						height: 44px;
						align-items: center;
						justify-content: center;
						border-radius: 11px;
						/* Flat fill, not a gradient: the tree's eyes and the notch beside
						   the trunk are evenodd knockouts, so the tile reads through them
						   and a gradient shows through at the wrong value. */
						background: var(--boot-amber);
						box-shadow: 0 10px 30px -8px color-mix(in oklab, var(--boot-amber) 50%, transparent);
					}
					.maple-bootshell__trace {
						position: relative;
						width: 200px;
						height: 73px;
					}
					.maple-bootshell__track,
					.maple-bootshell__span {
						position: absolute;
						height: 9px;
						border-radius: 9999px;
					}
					.maple-bootshell__track {
						background: color-mix(in oklab, var(--boot-amber) 9%, transparent);
					}
					.maple-bootshell__span {
						background: var(--boot-amber);
						transform-origin: left center;
						transform: scaleX(0);
						opacity: 0;
						animation: maple-bootshell-land 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
					}
					.maple-bootshell__track--1,
					.maple-bootshell__span--1 {
						top: 0;
						left: 0;
						width: 200px;
					}
					.maple-bootshell__track--2,
					.maple-bootshell__span--2 {
						top: 16px;
						left: 14px;
						width: 124px;
					}
					.maple-bootshell__track--3,
					.maple-bootshell__span--3 {
						top: 32px;
						left: 28px;
						width: 70px;
					}
					.maple-bootshell__track--4,
					.maple-bootshell__span--4 {
						top: 48px;
						left: 96px;
						width: 52px;
					}
					.maple-bootshell__track--5,
					.maple-bootshell__span--5 {
						top: 64px;
						left: 140px;
						width: 56px;
					}
					.maple-bootshell__span--1 {
						animation-delay: 0s;
					}
					.maple-bootshell__span--2 {
						animation-delay: 0.13s;
					}
					.maple-bootshell__span--3 {
						animation-delay: 0.26s;
					}
					.maple-bootshell__span--4 {
						animation-delay: 0.42s;
					}
					.maple-bootshell__span--5 {
						animation-delay: 0.58s;
					}
					@keyframes maple-bootshell-land {
						0% {
							transform: scaleX(0);
							opacity: 0;
						}
						13% {
							transform: scaleX(1);
							opacity: 1;
						}
						66% {
							transform: scaleX(1);
							opacity: 1;
						}
						84% {
							transform: scaleX(1);
							opacity: 0.2;
						}
						100% {
							transform: scaleX(0);
							opacity: 0;
						}
					}
					.maple-bootshell__scan {
						position: absolute;
						top: -6px;
						bottom: -6px;
						left: 0;
						width: 2px;
						border-radius: 2px;
						background: linear-gradient(
							180deg,
							transparent,
							color-mix(in oklab, var(--boot-amber) 85%, transparent),
							transparent
						);
						box-shadow: 0 0 10px 1px color-mix(in oklab, var(--boot-amber) 45%, transparent);
						transform: translateX(-2px);
						opacity: 0;
						animation: maple-bootshell-scan 2.4s linear infinite;
					}
					@keyframes maple-bootshell-scan {
						0% {
							transform: translateX(-2px);
							opacity: 0;
						}
						8% {
							opacity: 0.65;
						}
						78% {
							opacity: 0.65;
						}
						100% {
							transform: translateX(202px);
							opacity: 0;
						}
					}
					.maple-bootshell__caption {
						margin: 0;
						font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
						font-size: 12px;
						letter-spacing: 0.02em;
						color: var(--boot-muted);
					}
					@media (prefers-reduced-motion: reduce) {
						.maple-bootshell__span {
							transform: scaleX(1);
							opacity: 1;
							animation: none;
						}
						.maple-bootshell__scan {
							display: none;
						}
					}
				</style>
				<div class="maple-bootshell__mark">
					<svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true">
						<g transform="translate(4.1667 5.8333) scale(.0320253)">
							<path
								fill-rule="evenodd"
								fill="#fff"
								d="M369.38 0C480.324 2.908e-08 572.686 76.542 592.669 177.775C681.438 222.749 738.763 293.878 738.765 373.942C738.763 482.538 633.316 574.71 486.96 607.449C499.978 645.591 508.455 690.397 510.789 738.765L227.967 738.764C229.399 709.074 233.146 680.725 238.834 654.436C269.538 661.732 306.949 666.785 347.396 664.859L345.194 618.741C208.102 625.268 0.005 528.243 0 373.948C2.099e-08 293.883 57.322 222.751 146.093 177.775C166.076 76.543 258.436 0.001 369.38 0ZM202.322 258.434C174.48 255.016 149.271 273.738 146.015 300.254L133.046 405.874C129.791 432.389 149.721 456.662 177.563 460.08C205.404 463.499 230.614 444.769 233.87 418.254L246.839 312.633C250.095 286.118 230.163 261.853 202.322 258.434ZM367.3 278.691C339.459 275.273 314.117 295.071 310.699 322.913L298.319 423.736C294.902 451.576 314.7 476.918 342.541 480.337C370.382 483.755 395.724 463.955 399.143 436.115L411.523 335.292C414.941 307.451 395.142 282.109 367.3 278.691Z"
							/>
						</g>
					</svg>
				</div>
				<div class="maple-bootshell__trace" aria-hidden="true">
					<span class="maple-bootshell__track maple-bootshell__track--1"></span>
					<span class="maple-bootshell__track maple-bootshell__track--2"></span>
					<span class="maple-bootshell__track maple-bootshell__track--3"></span>
					<span class="maple-bootshell__track maple-bootshell__track--4"></span>
					<span class="maple-bootshell__track maple-bootshell__track--5"></span>
					<span class="maple-bootshell__span maple-bootshell__span--1"></span>
					<span class="maple-bootshell__span maple-bootshell__span--2"></span>
					<span class="maple-bootshell__span maple-bootshell__span--3"></span>
					<span class="maple-bootshell__span maple-bootshell__span--4"></span>
					<span class="maple-bootshell__span maple-bootshell__span--5"></span>
					<span class="maple-bootshell__scan"></span>
				</div>
				<p class="maple-bootshell__caption">Collecting spans…</p>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
