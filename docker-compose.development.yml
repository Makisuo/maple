services:
    # Dev database for `alchemy dev` (the dev Hyperdrive origin in
    # apps/api/alchemy.run.ts points here). Port 5499 dodges any host
    # Postgres. vitest does NOT need this — tests run embedded PGlite.
    postgres:
        image: postgres:17-alpine
        # wal_level=logical is a runtime GUC (not initdb-time), so flipping it on an
        # existing volume needs no reset. Electric tails the WAL for shape sync.
        command: ["postgres", "-c", "wal_level=logical"]
        ports:
            - "5499:5432"
        environment:
            POSTGRES_USER: maple
            POSTGRES_PASSWORD: maple
            POSTGRES_DB: maple
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U maple -d maple"]
            interval: 5s
            timeout: 3s
            retries: 5

    # ElectricSQL sync service for local dev. The apps/api shape proxy
    # (/api/sync/shape) points at http://localhost:3473 and is the only thing that
    # talks to it. ELECTRIC_MANUAL_TABLE_PUBLISHING mirrors prod: the publication
    # is owned by a Drizzle migration, not by Electric.
    electric:
        image: electricsql/electric:latest
        ports:
            - "3473:3000"
        environment:
            DATABASE_URL: postgresql://maple:maple@postgres:5432/maple?sslmode=disable
            ELECTRIC_INSECURE: "true"
            ELECTRIC_MANUAL_TABLE_PUBLISHING: "true"
        depends_on:
            postgres:
                condition: service_healthy

    clickhouse:
        # Keep in sync with the clickhouse-schema-e2e job in .github/workflows/ci.yml —
        # CI verifies migrations against exactly one version, and it should be the one
        # developers actually run.
        image: clickhouse/clickhouse-server:26.2
        ports:
            - "8123:8123" # HTTP (queries, migrations, mapleexporter)
            - "9000:9000" # native protocol (optional; handy for clickhouse-client)
        environment:
            CLICKHOUSE_DB: default
            CLICKHOUSE_USER: maple
            CLICKHOUSE_PASSWORD: maple
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        volumes:
            - clickhouse-data:/var/lib/clickhouse
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    otel-collector:
        build:
            context: .
            dockerfile: otel/otel-collector.Dockerfile
        ports:
            - "4317:4317"
            - "4318:4318"
            - "13133:13133"
        env_file: .env.local
        environment:
            MAPLE_CLICKHOUSE_PASSWORD: maple
        volumes:
            - ./otel/collector-config.clickhouse.yaml:/etc/otel/config.yaml
        user: "0:0"

volumes:
    postgres-data:
    clickhouse-data:
