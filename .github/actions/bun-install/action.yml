name: bun install
description: >-
    Frozen-lockfile install, shared by every CI job so there is one place to
    change install behaviour.

    Deliberately NOT cached. ~/.bun/install/cache for this repo is ~739MB, and
    caching it measured consistently SLOWER than a cold install: knip's install
    went 34s -> 57s and local-checkpoint-native's 44s -> 113s. tar is the cost,
    not bandwidth: node_modules here is ~750k inodes across ~4.5k packages, and
    no transfer rate fixes per-file serialization. Do not re-add actions/cache
    here without measuring the step both ways.

    This previously mounted node_modules on a Blacksmith sticky disk — a
    block-level ext4 clone that avoids the tarball round-trip entirely. There is
    no GitHub-hosted equivalent, so it went away with the move back off
    Blacksmith; see git history if it ever returns.

inputs:
    working-directory:
        description: Directory holding the bun.lock to install from.
        required: false
        default: "."
    filters:
        description: >-
            Optional space-separated workspace filters. When set, the root `maple`
            workspace (CI tools) and only these dependency closures are installed.
            Use only with the root lockfile; nested standalone workspaces should leave
            this empty.
        required: false
        default: ""

runs:
    using: composite
    steps:
        - env:
              MAPLE_WORKSPACE_FILTERS: ${{ inputs.filters }}
          run: |
              if [[ -z "$MAPLE_WORKSPACE_FILTERS" ]]; then
                bun install --frozen-lockfile
                exit 0
              fi

              read -r -a filters <<< "$MAPLE_WORKSPACE_FILTERS"
              args=(--filter=maple)
              for filter in "${filters[@]}"; do
                args+=(--filter="$filter")
              done
              bun install --frozen-lockfile "${args[@]}"
          shell: bash
          working-directory: ${{ inputs.working-directory }}
