name: Deploy PR ingest gateway (AWS via Alchemy)

# On-demand ECS deployment of `apps/ingest` for ONE pull request — the way to
# test the gateway on Fargate before it reaches staging. Deploys only
# `scripts/ingest-preview.run.ts` (VPC, security groups, cluster, secrets, ALB,
# gateway service, and with `collector: true` the in-VPC OTel collector + its
# Cloud Map namespace — no workers, no certificate: the ALB answers plain HTTP
# on 80),
# tagged `maple-ingest-pr-<n>` in the prod AWS account. It is torn down when
# the PR closes (the `pull_request: closed` trigger below — the stack outlives
# nothing but the PR), or earlier by re-running with `action: destroy`. A
# VPC + ALB per PR is real money for a stack nothing points at, which is why
# the main stack's `pr` stage never carries the AWS half.
#
# Manual only. Credentials come from the `staging` environment (the AWS deploy
# role's trust policy and the Infisical identity only accept the production
# and staging subjects), so the task runs against staging's ingest-key store,
# Tinybird target and keys.
on:
    # Automatic teardown. Runs for EVERY closed PR; the destroy itself is
    # skipped when no `maple-ingest-pr-<n>` cluster exists, so a PR that never
    # had a preview costs one short job and no AWS calls beyond the lookup.
    pull_request:
        types: [closed]
    workflow_dispatch:
        inputs:
            pr_number:
                description: "Pull request number — the stack deploys as stage pr-<n>"
                type: number
                required: true
            action:
                description: "deploy (create/update) or destroy"
                type: choice
                options: [deploy, destroy]
                default: deploy
            collector:
                description: "Also deploy the in-VPC OTel collector (MAPLE_DEPLOY_AWS_COLLECTOR=1) — prd-only by default, see stageDeploysCollector"
                type: boolean
                default: false

concurrency:
    group: pr-ingest-${{ inputs.pr_number || github.event.pull_request.number }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Infisical + AWS OIDC

jobs:
    # Separate job because it needs an arm64 runner — see the workflow itself.
    # Skipped on a destroy (including every closed-PR teardown): there is
    # nothing to deploy, so nothing to compile.
    ingest-binary:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' }}
        uses: ./.github/workflows/build-ingest-binary.yml

    ingest:
        # Fork PRs get no staging credentials.
        # `!cancelled()` rather than a plain `needs`: a destroy skips the build
        # job, and a skipped dependency would otherwise skip the teardown with
        # it. The explicit `result != 'failure'` keeps a BROKEN build from
        # deploying anyway.
        needs: ingest-binary
        if: ${{ !cancelled() && needs.ingest-binary.result != 'failure' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: staging
        env:
            INFISICAL_ENV_SLUG: staging
            PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
            # A closed PR always destroys.
            ACTION: ${{ github.event_name == 'pull_request' && 'destroy' || inputs.action }}
            COMMIT_SHA: ${{ github.sha }}
            # Opt the preview into the collector for this run (it is prd-only
            # otherwise — a cash-flow call, see `stageDeploysCollector`).
            MAPLE_DEPLOY_AWS_COLLECTOR: ${{ inputs.collector && '1' || '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            # AFTER Infisical — see the note in deploy-prd.yml.
            - name: Configure AWS credentials (OIDC)
              id: aws
              uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Compiled by the `ingest-binary` job above, on an arm64 runner —
            # the ECS tasks are Graviton. The artifact upload drops the exec
            # bit, and `Dockerfile.prebuilt` COPYs the file mode straight into
            # the image, so restore it here or the task exits on `permission
            # denied`.
            # `Dockerfile.prebuilt` builds for linux/arm64 (the tasks are Graviton)
            # and has a `RUN apt-get` layer, so this x86 runner has to be able to
            # execute arm64 binaries to build it. Registers the binfmt handlers.
            # The COPYed binary itself is compiled natively by the build job —
            # nothing heavy is emulated here, just one apt-get layer.
            - name: Register arm64 binfmt handlers (QEMU)
              if: env.ACTION == 'deploy'
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
              with:
                  platforms: arm64

            - name: Download ingest binary
              if: env.ACTION == 'deploy'
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: maple-ingest
                  path: apps/ingest/dist

            - name: Restore exec bit on ingest binary
              if: env.ACTION == 'deploy'
              run: chmod +x apps/ingest/dist/maple-ingest

            # Only a stack that exists gets destroyed: the ECS cluster is created
            # with the stack and named deterministically, so its absence means
            # "nothing to tear down" (every closed PR reaches this step).
            - name: Check whether the preview stack exists
              id: exists
              if: env.ACTION == 'destroy'
              run: |
                  status=$(aws ecs describe-clusters --clusters "maple-ingest-pr-$PR_NUMBER" \
                      --query 'clusters[0].status' --output text 2>/dev/null || echo "NONE")
                  echo "cluster status: $status"
                  if [ "$status" = "ACTIVE" ]; then echo "stack=true" >> "$GITHUB_OUTPUT"; else echo "stack=false" >> "$GITHUB_OUTPUT"; fi

            # AWS_ACCOUNT_ID: see the note in deploy-prd.yml — without it alchemy's
            # env-credential path deadlocks silently.
            - name: Deploy ingest preview stack with Alchemy
              if: env.ACTION == 'deploy'
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: bunx alchemy deploy scripts/ingest-preview.run.ts --yes --adopt --stage "pr-$PR_NUMBER"

            # Is the collector running, discoverable by the name the gateway was
            # given, and exporting — and did the gateway's own telemetry land in
            # the stage's warehouse? Fails the job if the collector is missing or
            # logs export errors.
            - name: Verify the collector beside the gateway
              if: env.ACTION == 'deploy' && env.MAPLE_DEPLOY_AWS_COLLECTOR == '1'
              env:
                  AWS_REGION: us-east-1
              run: bash scripts/ingest-preview-verify.sh

            - name: Destroy ingest preview stack with Alchemy
              if: env.ACTION == 'destroy' && steps.exists.outputs.stack == 'true'
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: bunx alchemy destroy scripts/ingest-preview.run.ts --yes --stage "pr-$PR_NUMBER"

            # alchemy writes its stdout to .alchemy/log/out — surface it either way.
            - name: Dump alchemy log
              if: always()
              run: |
                  echo "===== .alchemy/log/out ====="
                  cat .alchemy/log/out 2>/dev/null || echo "(missing)"
                  echo "===== .alchemy/log/err ====="
                  cat .alchemy/log/err 2>/dev/null || echo "(missing)"
