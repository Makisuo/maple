name: AWS Probe (manual)

# Bisect harness for the ingest deploy hang — now explained: alchemy's
# env-credential path deadlocks on its STS account lookup unless AWS_ACCOUNT_ID
# is set (see deploy-prd.yml), which every step here now does. Kept as the
# cheap way to exercise the AWS provider path in CI without a production
# deploy. Manual only — nothing triggers it automatically, and it deploys no
# application code.
#
# Why this exists: the hang only reproduces in CI, and reproducing it through
# `Deploy PRD` costs a 45-minute timeout per attempt and blocks production
# behind it. This runs the same AWS provider set, on the same runner image,
# with the same OIDC credentials, against one resource class at a time, with a
# 12-minute ceiling — so an attempt is minutes, not most of an hour.
on:
    workflow_dispatch:
        inputs:
            level:
                description: "How far to go: ecr (repository) → network (VPC) → image (docker build + push)"
                type: choice
                options: [ecr, network, image]
                default: ecr
            state:
                description: "State backend: local (file) or cloud (the shared Cloudflare store the real deploy uses)"
                type: choice
                options: [local, cloud]
                default: local
            keep:
                description: "Keep the resources instead of destroying them (leave off unless you need to inspect)"
                type: boolean
                default: false

concurrency:
    group: aws-probe
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    # Only the `image` level needs a binary to COPY; the cheaper levels skip the
    # compile entirely. Separate job because it needs an arm64 runner — see the
    # workflow itself.
    ingest-binary:
        if: ${{ inputs.level == 'image' }}
        uses: ./.github/workflows/build-ingest-binary.yml

    probe:
        # `!cancelled()` because the ecr/network levels skip the build job, and a
        # skipped dependency would otherwise skip the probe with it.
        needs: ingest-binary
        if: ${{ !cancelled() && needs.ingest-binary.result != 'failure' }}
        runs-on: ubuntu-latest
        # Not a long-running deploy: if a level has not settled in this window it
        # has hung, and that IS the result. The compile no longer competes for
        # this budget at all — it is its own job now (build-ingest-binary.yml),
        # so a slow build shows up as a slow build rather than masquerading as
        # the hang being investigated.
        timeout-minutes: 20
        # The OIDC role's trust policy only accepts
        # `repo:MapleTechLabs/maple:environment:{production,staging}` subs, so the
        # job has to declare one of them to get credentials at all.
        environment: production
        env:
            PROBE_LEVEL: ${{ inputs.level }}
            PROBE_STATE: ${{ inputs.state }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

            # Needed only for `state: cloud` (the state store authenticates to
            # Cloudflare), but unconditional so the two runs differ in exactly one
            # variable — the state backend — and nothing else.
            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: "prod"
                  export-type: "env"
                  secret-path: "/"

            - name: Configure AWS credentials (OIDC)
              id: aws
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Compiled by the `ingest-binary` job above, on an arm64 runner —
            # the ECS tasks are Graviton. The artifact upload drops the exec
            # bit, and `Dockerfile.prebuilt` COPYs the file mode straight into
            # the image, so restore it here or the task exits on `permission
            # denied`.
            # `Dockerfile.prebuilt` builds for linux/arm64 (the tasks are Graviton)
            # and has a `RUN apt-get` layer, so this x86 runner has to be able to
            # execute arm64 binaries to build it. Registers the binfmt handlers.
            # The COPYed binary itself is compiled natively by the build job —
            # nothing heavy is emulated here, just one apt-get layer.
            - name: Register arm64 binfmt handlers (QEMU)
              if: inputs.level == 'image'
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
              with:
                  platforms: arm64

            - name: Download ingest binary
              if: inputs.level == 'image'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: maple-ingest
                  path: apps/ingest/dist

            - name: Restore exec bit on ingest binary
              if: inputs.level == 'image'
              run: chmod +x apps/ingest/dist/maple-ingest

            # The watchdog is the whole point on a hang: alchemy prints nothing, so
            # the process table is the only witness. A busy cargo/docker child means
            # slow; bun at 0% CPU means blocked, and wchan names the kernel wait.
            - name: Probe
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: |
                  (
                      while true; do
                          sleep 30
                          echo "=== watchdog $(date -u +%H:%M:%S) ==="
                          ps -eo pid,ppid,etime,pcpu,stat,wchan:20,args --sort=-pcpu | head -12
                          for p in $(pgrep -x bun || true); do
                              echo "--- bun $p fds ---"
                              ls -l "/proc/$p/fd" 2>/dev/null | tail -12
                          done
                          docker ps --format '{{.ID}} {{.Image}} {{.Status}}' 2>&1 | head -5
                          echo "--- .alchemy/log/out (tail) ---"
                          tail -n 20 .alchemy/log/out 2>/dev/null || echo "(no log yet)"
                      done
                  ) &
                  trap 'kill %1 2>/dev/null || true' EXIT
                  bunx alchemy deploy scripts/aws-probe.run.ts --yes --adopt --stage probe

            # alchemy writes its stdout to .alchemy/log/out, NOT to the console. That
            # single fact explains every "silent hang" in this investigation: four
            # production runs and a --log-level debug run all looked like 40 minutes
            # of nothing while the log sat in the workspace. Found via /proc/<pid>/fd
            # in the watchdog output.
            # BEFORE destroy, always: `alchemy destroy` removes the local state
            # directory on success, so uploading afterwards captured nothing and
            # `if-no-files-found: ignore` swallowed the fact silently.
            - name: Upload probe state for recovery
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: alchemy-probe-state
                  path: .alchemy/
                  if-no-files-found: warn
                  retention-days: 7

            - name: Dump alchemy log
              if: always()
              run: |
                  echo "===== .alchemy/log/out ====="
                  cat .alchemy/log/out 2>/dev/null || echo "(missing)"
                  echo "===== .alchemy/log/err ====="
                  cat .alchemy/log/err 2>/dev/null || echo "(missing)"

            - name: Destroy probe resources
              if: always() && !inputs.keep
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: |
                  if ! bunx alchemy destroy scripts/aws-probe.run.ts --yes --stage probe; then
                      echo "::warning title=Probe teardown failed::Probe resources may still exist in 465760687006. Download the alchemy-probe-state artifact from this run, unpack it at the repo root, and re-run: bunx alchemy destroy scripts/aws-probe.run.ts --yes --stage probe"
                  fi
