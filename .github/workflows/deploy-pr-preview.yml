name: Deploy PR Preview (Cloudflare + AWS via Alchemy)

# PREVIEW DEPLOYS ARE LABEL-GATED. A pull request gets a preview only while it
# carries the `preview` label; the stack is torn down when the label is removed
# or the PR closes. The label is the spend gate: a preview is now the FULL
# stack, AWS half included — its own VPC, ALB and ECS ingest fleet
# (`stageDeploysIngest` covers `pr`), which is real money for as long as the
# label is on.
#
# Add `preview:collector` alongside it to also get the in-VPC OTel collector
# (prd-only by default — see `stageDeploysCollector`); that is how the collector
# is verified on Fargate before it reaches prod.
#
# Previews deploy without an application database — see the comment further down
# and `resolveDatabaseMode` in packages/infra/src/cloudflare/stage.ts.
#
# cleanup-preview-orphans.yml stays the backstop: its 6-hourly sweeps reap any
# preview worker, queue, Tinybird branch or Hyperdrive config whose PR closes
# without a teardown run (GitHub creates no `closed` run for a PR that conflicts
# with its base branch).
on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - labeled
            - unlabeled
            - closed

concurrency:
    group: pr-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write
    id-token: write # Infisical OIDC machine-identity auth
    pull-requests: write

jobs:
    # Separate job because it needs an arm64 runner — see the workflow itself.
    # Skipped on a teardown: there is nothing to deploy, so nothing to compile.
    ingest-binary:
        if: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository
            && github.event.action != 'closed'
            && github.event.action != 'unlabeled'
            && contains(github.event.pull_request.labels.*.name, 'preview') }}
        uses: ./.github/workflows/build-ingest-binary.yml

    deploy-pr-preview:
        # Deploy while the `preview` label is on; tear down when it comes off or
        # the PR closes. On an `unlabeled` event the payload's label list already
        # excludes the removed label, so the first two clauses do not overlap.
        #
        # `!cancelled()` rather than a plain `needs`: a teardown skips the binary
        # build, and a skipped dependency would otherwise skip the teardown with
        # it. The explicit `result != 'failure'` keeps a BROKEN build from
        # deploying anyway.
        needs: ingest-binary
        if: >-
            ${{ !cancelled() && needs.ingest-binary.result != 'failure'
            && github.event.pull_request.head.repo.full_name == github.repository
            && (github.event.action == 'closed'
                || (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
                || (github.event.action != 'unlabeled'
                    && contains(github.event.pull_request.labels.*.name, 'preview'))) }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        # `pr-preview` environment must require manual approval in repo settings.
        # This blocks PR-controlled code (install scripts, build steps) from
        # accessing Infisical secrets until a maintainer reviews the diff.
        #
        # ⚠️ NOT CURRENTLY CONFIGURED, and adding it right now would break the
        # scheduled orphan sweep: cleanup-preview-orphans.yml temporarily borrows
        # this environment to satisfy the Infisical OIDC subject allowlist, and a
        # cron run has no human to approve it — it would park in `waiting` until
        # the deployment expires. Decouple that job first (allowlist the subject
        # `repo:<org>/<repo>:ref:refs/heads/main` in Infisical and drop its
        # `environment:` line), THEN add required reviewers here.
        # `url` surfaces the deployed web app as a clickable deployment on the PR
        # (empty on `closed`, when the deploy step is skipped).
        environment:
            name: pr-preview
            url: ${{ steps.deploy.outputs.web_url }}
        env:
            # Uses Infisical's default `dev` environment for now; swap to a
            # dedicated `preview` env later if PR previews need isolated secrets.
            INFISICAL_ENV_SLUG: dev
            # The job runs on `unlabeled` only when the removed label was
            # `preview` (see the `if` above), so both actions mean "tear down".
            TEARDOWN: ${{ (github.event.action == 'closed' || github.event.action == 'unlabeled') && 'true' || 'false' }}
            # Opt the preview into the in-VPC OTel collector (prd-only otherwise —
            # a cash-flow call, see `stageDeploysCollector`).
            MAPLE_DEPLOY_AWS_COLLECTOR: ${{ contains(github.event.pull_request.labels.*.name, 'preview:collector') && '1' || '' }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            PR_BRANCH: ${{ github.head_ref }}
            # Stamped onto deployed telemetry as `vcs.ref.head.revision`. Use the PR
            # head SHA (github.sha is the merge commit on pull_request events).
            COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
            VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

            # Needed for both branch create (deploy) and rm (close). `tb` is the
            # real Tinybird CLI (branch commands live there, not in `bunx tinybird`).
            # Runs BEFORE secrets are loaded so a compromised installer never sees
            # the job's exported Infisical secrets.
            - name: Install Tinybird CLI
              run: curl https://tinybird.co | sh

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            # AFTER Infisical — see the note in deploy-prd.yml.
            #
            # ⚠️ The deploy role's trust policy must accept this job's OIDC
            # subject (`repo:<org>/<repo>:environment:pr-preview`). It was
            # written for the production and staging subjects only; previews get
            # AccessDenied until it is widened.
            - name: Configure AWS credentials (OIDC)
              id: aws
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Compiled by the `ingest-binary` job above, on an arm64 runner —
            # the ECS tasks are Graviton. The artifact upload drops the exec
            # bit, and `Dockerfile.prebuilt` COPYs the file mode straight into
            # the image, so restore it here or the task exits on `permission
            # denied`.
            # `Dockerfile.prebuilt` builds for linux/arm64 (the tasks are Graviton)
            # and has a `RUN apt-get` layer, so this x86 runner has to be able to
            # execute arm64 binaries to build it. Registers the binfmt handlers.
            # The COPYed binary itself is compiled natively by the build job —
            # nothing heavy is emulated here, just one apt-get layer.
            - name: Register arm64 binfmt handlers (QEMU)
              if: ${{ env.TEARDOWN != 'true' }}
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
              with:
                  platforms: arm64

            - name: Download ingest binary
              if: ${{ env.TEARDOWN != 'true' }}
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: maple-ingest
                  path: apps/ingest/dist

            - name: Restore exec bit on ingest binary
              if: ${{ env.TEARDOWN != 'true' }}
              run: chmod +x apps/ingest/dist/maple-ingest

            # Tinybird's TypeScript resource generator loads @maple/domain from source,
            # whose span-display helpers import this package through its dist exports.
            # A clean runner has no dist/ until the workspace dependency is built.
            - name: Build Tinybird TypeScript workspace dependencies
              if: ${{ env.TEARDOWN != 'true' }}
              run: bun turbo build --filter=@maple-dev/clickhouse-builder

            # Create/refresh an ephemeral Tinybird branch `pr_<n>` seeded with the
            # latest prod partition, deploy this PR's schema into it, and override
            # TINYBIRD_HOST/TINYBIRD_TOKEN (from Infisical `dev`) with the branch's
            # values so the Alchemy deploy below binds the whole stack to the branch.
            - name: Create/refresh Tinybird PR branch
              if: ${{ env.TEARDOWN != 'true' }}
              run: bun scripts/tinybird-pr-branch.ts up "$PR_NUMBER"

            # NO DATABASE STEP HERE, ON PURPOSE. PR previews used to provision an
            # ephemeral PlanetScale branch `pr-<n>` (+ migrations + an Electric
            # Cloud source pointed at it). PS-DEV branches bill for time used and
            # every preview also burned one of the account's 25 Hyperdrive configs,
            # so as of 2026-08 the `pr` stage deploys with NO application database:
            # `resolveDatabaseMode` (packages/infra/src/cloudflare/stage.ts) returns
            # "none", no MAPLE_DB binding is created, and DatabasePgLive fails per
            # query — DB-backed routes 500 while the rest of the preview works.
            #
            # To restore per-PR databases: flip that resolver back to "managed" for
            # `pr` and re-add the steps this comment replaced (PlanetScale CLI setup,
            # `planetscale-pr-branch.ts up`, `db:ensure-privileges`, `db:migrate`,
            # `db:normalize-preview`, `electric-pr-branch.ts up`, and the matching
            # `planetscale-pr-branch.ts down` teardown). Every script is still in the
            # repo, dormant.

            # AWS_ACCOUNT_ID: see the note in deploy-prd.yml — without it alchemy's
            # env-credential path deadlocks silently.
            - name: Deploy PR preview stack with Alchemy
              id: deploy
              if: ${{ env.TEARDOWN != 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: bun run alchemy:deploy:pr

            - name: Destroy PR preview stack with Alchemy
              id: destroy
              if: ${{ env.TEARDOWN == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: bun run alchemy:destroy:pr

            # Is the collector running, discoverable by the name the gateway was
            # given, and exporting — and did the gateway's own telemetry land in
            # the stage's warehouse? Fails the job if the collector is missing or
            # logs export errors.
            - name: Verify the collector beside the gateway
              if: ${{ env.TEARDOWN != 'true' && env.MAPLE_DEPLOY_AWS_COLLECTOR == '1' }}
              env:
                  AWS_REGION: us-east-1
              run: bash scripts/ingest-preview-verify.sh

            # `!cancelled()` keeps each teardown step running even when a sibling
            # teardown step fails — a failed `alchemy destroy` must not leave the
            # Electric/Tinybird resources behind (that skip-chain is how the
            # pre-#215 orphan fleet accumulated).

            # Delete the Electric Cloud environment `pr-<n>` (its services are
            # deleted first — Electric refuses to delete an env holding
            # services). Residual since previews stopped creating sources: this
            # only reaps environments left over from PRs opened before 2026-08,
            # and is a no-op afterwards. Kept because each old source still holds
            # a plan max-databases slot.
            - name: Remove Electric Cloud PR source
              if: ${{ !cancelled() && env.TEARDOWN == 'true' && env.ELECTRIC_API_TOKEN != '' }}
              run: bun scripts/electric-pr-branch.ts down "$PR_NUMBER"

            # Tear the branch down after the stack — branches share compute with
            # production, so this must run on every PR close.
            - name: Remove Tinybird PR branch
              if: ${{ !cancelled() && env.TEARDOWN == 'true' }}
              run: bun scripts/tinybird-pr-branch.ts down "$PR_NUMBER"

            - name: Post or update PR preview comment
              if: ${{ always() }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  ACTION: ${{ github.event.action }}
                  TEARDOWN: ${{ env.TEARDOWN }}
                  INGEST_URL: ${{ steps.deploy.outputs.ingest_url }}
                  DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
                  DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
                  WEB_URL: ${{ steps.deploy.outputs.web_url }}
                  API_URL: ${{ steps.deploy.outputs.api_url }}
                  SYNC_URL: ${{ steps.deploy.outputs.sync_url }}
                  COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
                  COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COMMENT_OUTPUT: ${{ runner.temp }}/maple-preview-comment.md
              run: |
                  set -euo pipefail

                  marker="<!-- maple-preview-comment -->"
                  short_sha="${COMMIT_SHA:0:7}"

                  # Markdown code spans use literal backticks in the printf formats.
                  # shellcheck disable=SC2016
                  {
                    echo "$marker"
                    echo
                    echo "## 🍁 Maple PR preview"
                    echo

                    if [ "$TEARDOWN" = "true" ]; then
                      if [ "$DESTROY_OUTCOME" = "success" ]; then
                        echo "> [!NOTE]"
                        if [ "$ACTION" = "closed" ]; then
                          echo "> Preview resources were removed when this pull request closed."
                        else
                          echo "> Preview resources were removed when the \`preview\` label came off."
                        fi
                      else
                        echo "> [!WARNING]"
                        printf '> Preview cleanup could not be confirmed. The Alchemy teardown outcome was `%s`.\n' "$DESTROY_OUTCOME"
                      fi

                      echo
                      printf 'Final commit [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    elif [ "$DEPLOY_OUTCOME" = "success" ]; then
                      echo "The preview is ready:"
                      echo
                      echo "| Service | Preview URL |"
                      echo "| :-- | :-- |"
                      printf '| Web | [%s](%s) |\n' "${WEB_URL#https://}" "$WEB_URL"
                      printf '| API | [%s](%s) |\n' "${API_URL#https://}" "$API_URL"
                      printf '| Electric Sync | [%s](%s) |\n' "${SYNC_URL#https://}" "$SYNC_URL"
                      if [ -n "$INGEST_URL" ]; then
                        printf '| Ingest (OTLP, plain HTTP) | [%s](%s) |\n' "${INGEST_URL#http://}" "$INGEST_URL"
                      fi
                      echo
                      printf 'Deployed from [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    else
                      echo "> [!WARNING]"
                      printf '> The latest preview deployment did not complete. The Alchemy deploy outcome was `%s`; any earlier preview should be treated as stale.\n' "$DEPLOY_OUTCOME"
                      echo
                      printf 'Commit [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    fi
                  } > "$COMMENT_OUTPUT"

                  existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                    --jq '.[] | select(.body | startswith("<!-- maple-preview-comment -->")) | .id' \
                    | head -n 1)
                  if [ -n "$existing" ]; then
                    payload="$RUNNER_TEMP/maple-preview-comment-payload.json"
                    jq -Rs '{body: .}' < "$COMMENT_OUTPUT" > "$payload"
                    gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                      --input "$payload" >/dev/null
                    echo "updated existing preview comment $existing"
                  else
                    gh pr comment "$PR_NUMBER" --body-file "$COMMENT_OUTPUT"
                  fi
