name: Deploy PR Preview (Cloudflare via Alchemy)

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - closed

concurrency:
    group: pr-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write
    id-token: write # Infisical OIDC machine-identity auth
    pull-requests: write

jobs:
    deploy-pr-preview:
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: blacksmith-4vcpu-ubuntu-2404
        # `pr-preview` environment must require manual approval in repo settings.
        # This blocks PR-controlled code (install scripts, build steps) from
        # accessing Infisical secrets until a maintainer reviews the diff.
        # `url` surfaces the deployed web app as a clickable deployment on the PR
        # (empty on `closed`, when the deploy step is skipped).
        environment:
            name: pr-preview
            url: ${{ steps.deploy.outputs.web_url }}
        env:
            # Uses Infisical's default `dev` environment for now; swap to a
            # dedicated `preview` env later if PR previews need isolated secrets.
            INFISICAL_ENV_SLUG: dev
            PR_NUMBER: ${{ github.event.pull_request.number }}
            PR_BRANCH: ${{ github.head_ref }}
            # Stamped onto deployed telemetry as `deployment.commit_sha`. Use the PR
            # head SHA (github.sha is the merge commit on pull_request events).
            COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
            VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Tinybird's TypeScript resource generator loads @maple/domain from source,
            # whose span-display helpers import this package through its dist exports.
            # A clean runner has no dist/ until the workspace dependency is built.
            - name: Build Tinybird TypeScript workspace dependencies
              if: ${{ github.event.action != 'closed' }}
              run: bun turbo build --filter=@maple-dev/clickhouse-builder

            # Needed for both branch create (deploy) and rm (close). `tb` is the
            # real Tinybird CLI (branch commands live there, not in `bunx tinybird`).
            - name: Install Tinybird CLI
              run: curl https://tinybird.co | sh

            # Create/refresh an ephemeral Tinybird branch `pr_<n>` seeded with the
            # latest prod partition, deploy this PR's schema into it, and override
            # TINYBIRD_HOST/TINYBIRD_TOKEN (from Infisical `dev`) with the branch's
            # values so the Alchemy deploy below binds the whole stack to the branch.
            - name: Create/refresh Tinybird PR branch
              if: ${{ github.event.action != 'closed' }}
              run: bun scripts/tinybird-pr-branch.ts up "$PR_NUMBER"

            - name: Install PlanetScale CLI
              if: ${{ env.PLANETSCALE_SERVICE_TOKEN != '' }}
              uses: planetscale/setup-pscale-action@v1

            # The PlanetScale + Alchemy steps below are gated on
            # PLANETSCALE_SERVICE_TOKEN: until the `dev` Infisical environment carries the
            # PlanetScale service token (+ PLANETSCALE_SERVICE_TOKEN_ID,
            # PLANETSCALE_ORG), PR previews can't provision a Postgres branch, so
            # they SKIP cleanly (the check stays green) rather than fail every PR.
            # Adding the token activates per-PR preview deploys automatically.

            # Ensure the ephemeral PlanetScale Postgres branch `pr-<n>` exists
            # and is empty (created once per PR — ~9 min provision — then reset
            # in SQL on later deploys), mint a credential, and export
            # MAPLE_PG_URL to GITHUB_ENV so the migrate + Alchemy steps below
            # bind to the branch.
            - name: Create/refresh PlanetScale PR branch
              if: ${{ github.event.action != 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              # GITHUB_TOKEN lets the script refuse to provision when the PR is
              # already closed — a delayed/re-run deploy after teardown would
              # otherwise recreate the branch with nothing left to delete it.
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: bun scripts/planetscale-pr-branch.ts up "$PR_NUMBER"

            - name: Run database migrations
              if: ${{ github.event.action != 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:migrate

            # Re-grant table/sequence privileges to the runtime role after every
            # migrate — table-rebuild migrations DROP+CREATE tables, which strips
            # grants and leaves the deployed worker with "permission denied for
            # table …" on every tick. See packages/db/scripts/grant-runtime-role.ts.
            - name: Grant runtime role privileges
              if: ${{ github.event.action != 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:grant

            # Reassign everything this run's ephemeral role created to `postgres`
            # so the NEXT deploy's role (which inherits postgres) can drop it —
            # pscale_api_* roles are not grantable to each other, so without this
            # the in-place reset always fails on the prior run's objects and
            # falls back to the ~9-minute delete → recreate path. See
            # packages/db/scripts/normalize-preview-ownership.ts.
            - name: Normalize preview branch ownership
              if: ${{ github.event.action != 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:normalize-preview

            # Create/refresh an Electric Cloud environment `pr-<n>` + a Postgres
            # source pointed at this PR's PlanetScale branch (via the dedicated
            # replication-role credential MAPLE_PG_ELECTRIC_URL), and
            # export ELECTRIC_URL/ELECTRIC_SOURCE_ID/ELECTRIC_SECRET to GITHUB_ENV so
            # the Alchemy deploy below binds the electric-sync worker to it. Runs
            # after migrations so `0009_electric_publication` exists. Gated on
            # ELECTRIC_API_TOKEN: until the `dev` Infisical environment carries the
            # Electric CLI token (+ ELECTRIC_PROJECT_ID), previews SKIP cleanly —
            # the electric-sync worker deploys unconfigured (503) and the web app
            # stays on its effect-atom fetches. Adding the token activates per-PR
            # sync automatically.
            - name: Create/refresh Electric Cloud PR source
              if: ${{ github.event.action != 'closed' && env.ELECTRIC_API_TOKEN != '' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              run: bun scripts/electric-pr-branch.ts up "$PR_NUMBER"

            - name: Deploy PR preview stack with Alchemy
              id: deploy
              if: ${{ github.event.action != 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              run: bun run alchemy:deploy:pr

            - name: Destroy PR preview stack with Alchemy
              id: destroy
              if: ${{ github.event.action == 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              # MAPLE_PG_URL is generated by the deploy run and does not survive
              # into this separate close-event runner. Destroy only needs a valid
              # URL so alchemy.run.ts can reconstruct the resource graph from
              # state; it never connects to this placeholder origin.
              env:
                  MAPLE_PG_URL: postgres://preview-teardown:preview-teardown@127.0.0.1:5432/postgres
              run: bun run alchemy:destroy:pr

            # After the stack (and its Hyperdrive config) is destroyed. PS-DEV
            # branches bill for time used — this must run on every PR close.
            # `!cancelled()` keeps each teardown step running even when a sibling
            # teardown step fails — a failed `alchemy destroy` must not leave the
            # PS/Electric/Tinybird branches behind (that skip-chain is how the
            # pre-#215 orphan fleet accumulated).
            - name: Remove PlanetScale PR branch
              if: ${{ !cancelled() && github.event.action == 'closed' && env.PLANETSCALE_SERVICE_TOKEN != '' }}
              run: bun scripts/planetscale-pr-branch.ts down "$PR_NUMBER"

            # Delete the Electric Cloud environment `pr-<n>` (its services are
            # deleted first — Electric refuses to delete an env holding
            # services). Each source holds a PlanetScale replication slot and a
            # plan max-databases slot, so teardown on close is mandatory.
            - name: Remove Electric Cloud PR source
              if: ${{ !cancelled() && github.event.action == 'closed' && env.ELECTRIC_API_TOKEN != '' }}
              run: bun scripts/electric-pr-branch.ts down "$PR_NUMBER"

            # Tear the branch down after the stack — branches share compute with
            # production, so this must run on every PR close.
            - name: Remove Tinybird PR branch
              if: ${{ !cancelled() && github.event.action == 'closed' }}
              run: bun scripts/tinybird-pr-branch.ts down "$PR_NUMBER"

            - name: Post or update PR preview comment
              if: ${{ always() }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  ACTION: ${{ github.event.action }}
                  DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
                  DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
                  WEB_URL: ${{ steps.deploy.outputs.web_url }}
                  API_URL: ${{ steps.deploy.outputs.api_url }}
                  CHAT_URL: ${{ steps.deploy.outputs.chat_url }}
                  SYNC_URL: ${{ steps.deploy.outputs.sync_url }}
                  COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
                  COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COMMENT_OUTPUT: ${{ runner.temp }}/maple-preview-comment.md
              run: |
                  set -euo pipefail

                  marker="<!-- maple-preview-comment -->"
                  short_sha="${COMMIT_SHA:0:7}"

                  # Markdown code spans use literal backticks in the printf formats.
                  # shellcheck disable=SC2016
                  {
                    echo "$marker"
                    echo
                    echo "## 🍁 Maple PR preview"
                    echo

                    if [ "$ACTION" = "closed" ]; then
                      if [ "$DESTROY_OUTCOME" = "success" ]; then
                        echo "> [!NOTE]"
                        echo "> Preview resources were removed when this pull request closed."
                      else
                        echo "> [!WARNING]"
                        printf '> Preview cleanup could not be confirmed. The Alchemy teardown outcome was `%s`.\n' "$DESTROY_OUTCOME"
                      fi

                      echo
                      printf 'Final commit [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    elif [ "$DEPLOY_OUTCOME" = "success" ]; then
                      echo "The preview is ready:"
                      echo
                      echo "| Service | Preview URL |"
                      echo "| :-- | :-- |"
                      printf '| Web | [%s](%s) |\n' "${WEB_URL#https://}" "$WEB_URL"
                      printf '| API | [%s](%s) |\n' "${API_URL#https://}" "$API_URL"
                      printf '| Chat | [%s](%s) |\n' "${CHAT_URL#https://}" "$CHAT_URL"
                      printf '| Electric Sync | [%s](%s) |\n' "${SYNC_URL#https://}" "$SYNC_URL"
                      echo
                      printf 'Deployed from [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    else
                      echo "> [!WARNING]"
                      printf '> The latest preview deployment did not complete. The Alchemy deploy outcome was `%s`; any earlier preview should be treated as stale.\n' "$DEPLOY_OUTCOME"
                      echo
                      printf 'Commit [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    fi
                  } > "$COMMENT_OUTPUT"

                  existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                    --jq '.[] | select(.body | startswith("<!-- maple-preview-comment -->")) | .id' \
                    | head -n 1)
                  if [ -n "$existing" ]; then
                    payload="$RUNNER_TEMP/maple-preview-comment-payload.json"
                    jq -Rs '{body: .}' < "$COMMENT_OUTPUT" > "$payload"
                    gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                      --input "$payload" >/dev/null
                    echo "updated existing preview comment $existing"
                  else
                    gh pr comment "$PR_NUMBER" --body-file "$COMMENT_OUTPUT"
                  fi
