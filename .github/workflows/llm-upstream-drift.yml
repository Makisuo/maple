name: LLM Upstream Drift

# `lib/llm` is a vendored copy of `anomalyco/opencode`'s `packages/llm`, pinned by SHA in
# `lib/llm/UPSTREAM.json`. This is the check that the vendored `src/` still matches that SHA outside
# the deltas documented in `lib/llm/MAPLE.md`.
#
# Scheduled rather than PR-blocking, deliberately. `scripts/sync-llm-upstream.ts` does a live
# `git fetch` of the upstream repo, so putting it in the CI path would make every PR depend on
# github.com/anomalyco being reachable — for a condition that changes only when someone edits
# vendored source or re-pins the SHA, neither of which is urgent enough to block a merge.
#
# `test/` is deliberately out of scope: it was ported from `bun:test` to vitest and from
# `@opencode-ai/http-recorder` to a local replay layer, so it no longer tracks upstream.

on:
    schedule:
        # Weekly. Drift here is a "someone edited vendored source" signal, not a live-site concern.
        - cron: "23 6 * * 1"
    workflow_dispatch:
    # Also on changes to the vendored source or the sync tooling itself, where the answer is
    # immediate and the fetch is justified.
    pull_request:
        branches: [main]
        paths:
            - "lib/llm/src/**"
            - "lib/llm/UPSTREAM.json"
            - "scripts/sync-llm-upstream.ts"

permissions:
    contents: read

concurrency:
    group: llm-upstream-drift-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Vendored source matches upstream
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

            - uses: ./.github/actions/bun-install

            # Fails when vendored `src/` has drifted from the pinned SHA outside the documented
            # delta. The fix is either `bun run llm:sync` (take upstream) or a new row in
            # `lib/llm/MAPLE.md` plus an entry in the script's `KNOWN_DELTAS` (keep the change).
            - run: bun run llm:sync:check
