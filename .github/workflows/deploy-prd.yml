name: Deploy PRD (Cloudflare via Alchemy)

# Gated on CI rather than `push: main`. Both used to fire on the same push with
# separate concurrency groups, so a red CI still shipped to production.
# `workflow_dispatch` stays as the manual escape hatch and skips the gate.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-prd
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Infisical OIDC machine-identity auth

jobs:
    deploy-prd:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        # On a workflow_run event `github.sha` is the default branch head, not the
        # commit CI actually ran against — so pin everything to head_sha, both for
        # what gets deployed and for the telemetry stamp.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        environment: production
        env:
            # Opt-in for the AWS/ECS ingest half (see alchemy.run.ts). Unset or not
            # "1", the deploy is the pure-Cloudflare stack that shipped in 2m05s.
            # Set the repo variable to "1" to reproduce the hang under investigation.
            MAPLE_DEPLOY_AWS_INGEST: ${{ vars.MAPLE_DEPLOY_AWS_INGEST }}
            INFISICAL_ENV_SLUG: prod
            # Stamped onto deployed telemetry as `deployment.commit_sha` (server SDK
            # reads COMMIT_SHA; web build reads VITE_COMMIT_SHA via Vite define).
            COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
            VITE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.ref }}

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            # AFTER Infisical: the OIDC exchange writes AWS_ACCESS_KEY_ID /
            # AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN / AWS_REGION into the env,
            # which is exactly what alchemy's AWS auth reads (it picks the `env`
            # method whenever CI=true). Running it last means these always win over
            # anything stale carrying the same names out of Infisical.
            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # The Rust gateway is compiled HERE, not inside the image build.
            # alchemy's docker build passes no --cache-from (AWS/ECR/Image.ts), and
            # a fresh runner's layer cache is empty, so a Dockerfile that runs
            # `cargo build` recompiles all 385 crates on every deploy — ~20 minutes,
            # however the layers are arranged. Out here the cargo cache survives
            # between runs, so an unchanged ingest is a no-op and a one-crate change
            # is about a minute. Dockerfile.prebuilt then just COPYs the result.
            #
            # Inside rust:1.88-bookworm rather than on the runner: the runtime base
            # is debian:bookworm-slim (glibc 2.36) and ubuntu-24.04 ships 2.39, so a
            # host-built binary starts and immediately dies with
            # `version 'GLIBC_2.39' not found`.
            - name: Cache ingest cargo build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo-ingest
                      ${{ runner.temp }}/ingest-target
                  key: ingest-cargo-${{ runner.os }}-${{ hashFiles('apps/ingest/Cargo.lock') }}-${{ hashFiles('apps/ingest/src/**') }}
                  restore-keys: |
                      ingest-cargo-${{ runner.os }}-${{ hashFiles('apps/ingest/Cargo.lock') }}-
                      ingest-cargo-${{ runner.os }}-

            # --target-dir points OUTSIDE apps/ingest deliberately. Alchemy hashes
            # the image context with `hashDirectory`, which has no .dockerignore
            # support and derives its exclusions from gitignore rules WITHOUT
            # rebasing root-anchored ones onto the context dir — `/apps/ingest/target`
            # becomes the glob `apps/ingest/target/**` evaluated with cwd=apps/ingest,
            # which matches nothing. A target dir inside the context would therefore
            # be walked and hashed in full on every deploy.
            - name: Build ingest binary
              run: |
                  mkdir -p ~/.cargo-ingest "$RUNNER_TEMP/ingest-target" apps/ingest/dist
                  docker run --rm \
                      --user "$(id -u):$(id -g)" \
                      -e CARGO_HOME=/cargo \
                      -v "$HOME/.cargo-ingest:/cargo" \
                      -v "$PWD/apps/ingest:/app" \
                      -v "$RUNNER_TEMP/ingest-target:/target" \
                      -w /app \
                      rust:1.88-bookworm \
                      cargo build --release --target-dir /target
                  cp "$RUNNER_TEMP/ingest-target/release/maple-ingest" apps/ingest/dist/maple-ingest

            # NOTE: prod schema migrations are applied OUT OF BAND (manually, via
            # `bun run migrate:prod` → `ps:apply-schema main`, against the direct 5432
            # port), NOT by this workflow — so a deploy never touches the prod database
            # and needs no MAPLE_PG_URL/admin credential. The worker binds to the
            # pre-configured `maple-prd` Hyperdrive (see apps/api/alchemy.run.ts).
            # apply-schema installs default privileges granting PUBLIC before it
            # migrates, so new and rebuilt tables are readable by every consumer —
            # including the ingest gateway, which reaches Postgres through PSBouncer as
            # a role that does NOT inherit `postgres`.
            - name: Deploy PRD stack with Alchemy
              run: bun run alchemy:deploy:prd
