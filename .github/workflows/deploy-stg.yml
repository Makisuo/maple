name: Deploy STG (Cloudflare via Alchemy)

# Gated on CI rather than `push: main` — see the note in deploy-prd.yml.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-stg
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Infisical OIDC machine-identity auth

jobs:
    deploy-stg:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        environment: staging
        env:
            INFISICAL_ENV_SLUG: staging
            # Stamped onto deployed telemetry as `deployment.commit_sha` (server SDK
            # reads COMMIT_SHA; web build reads VITE_COMMIT_SHA via Vite define).
            COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
            VITE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.ref }}

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # BEFORE migrate: installs default privileges granting PUBLIC on every
            # table created from here on, so a new or rebuilt table can never land
            # owner-only and leave a consumer with "permission denied for table …".
            # Default privileges only apply to objects created after they are set,
            # hence the ordering. See packages/db/scripts/ensure-privileges.ts.
            - name: Ensure database privileges
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:ensure-privileges

            # Schema migrations run against the PlanetScale branch over the
            # DIRECT port (5432, never the PSBouncer/Hyperdrive poolers — DDL
            # through a transaction pooler misbehaves). MAPLE_PG_URL is the
            # single Infisical secret (direct 5432, admin role).
            - name: Run database migrations
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:migrate

            - name: Deploy STG stack with Alchemy
              run: bun run alchemy:deploy:stg
