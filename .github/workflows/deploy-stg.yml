name: Deploy STG (Cloudflare via Alchemy)

# Gated on CI rather than `push: main` — see the note in deploy-prd.yml.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            aws_ingest:
                description: "Also deploy the ingest gateway to ECS (MAPLE_DEPLOY_AWS_INGEST=1) for this run only"
                type: boolean
                default: false

concurrency:
    group: deploy-stg
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Infisical OIDC machine-identity auth

jobs:
    deploy-stg:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        environment: staging
        env:
            # Opt-in for the AWS/ECS ingest half (see alchemy.run.ts). Unset or not
            # "1", the deploy is the pure-Cloudflare stack that shipped in 2m05s.
            # Standing opt-in is the MAPLE_DEPLOY_AWS_INGEST variable (set it on the
            # `staging` environment to scope it to this stage); a manual run can
            # force it on for one deploy via the `aws_ingest` input, which is how a
            # branch gets the gateway onto ECS for testing without touching the var.
            MAPLE_DEPLOY_AWS_INGEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.aws_ingest) && '1' || vars.MAPLE_DEPLOY_AWS_INGEST }}
            INFISICAL_ENV_SLUG: staging
            # Stamped onto deployed telemetry as `deployment.commit_sha` (server SDK
            # reads COMMIT_SHA; web build reads VITE_COMMIT_SHA via Vite define).
            COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
            VITE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.ref }}

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            # AFTER Infisical — see the note in deploy-prd.yml.
            - name: Configure AWS credentials (OIDC)
              id: aws
              uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Compiled outside the image build, in a bookworm container — see the
            # note in deploy-prd.yml.
            - name: Cache ingest cargo build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo-ingest
                      ${{ runner.temp }}/ingest-target
                  key: ingest-cargo-${{ runner.os }}-${{ hashFiles('apps/ingest/Cargo.lock') }}-${{ hashFiles('apps/ingest/src/**') }}
                  restore-keys: |
                      ingest-cargo-${{ runner.os }}-${{ hashFiles('apps/ingest/Cargo.lock') }}-
                      ingest-cargo-${{ runner.os }}-

            # --target-dir points OUTSIDE apps/ingest deliberately. Alchemy hashes
            # the image context with `hashDirectory`, which has no .dockerignore
            # support and derives its exclusions from gitignore rules WITHOUT
            # rebasing root-anchored ones onto the context dir — `/apps/ingest/target`
            # becomes the glob `apps/ingest/target/**` evaluated with cwd=apps/ingest,
            # which matches nothing. A target dir inside the context would therefore
            # be walked and hashed in full on every deploy.
            - name: Build ingest binary
              run: |
                  mkdir -p ~/.cargo-ingest "$RUNNER_TEMP/ingest-target" apps/ingest/dist
                  docker run --rm \
                      --user "$(id -u):$(id -g)" \
                      -e CARGO_HOME=/cargo \
                      -v "$HOME/.cargo-ingest:/cargo" \
                      -v "$PWD/apps/ingest:/app" \
                      -v "$RUNNER_TEMP/ingest-target:/target" \
                      -w /app \
                      rust:1.94-bookworm \
                      cargo build --release --target-dir /target
                  cp "$RUNNER_TEMP/ingest-target/release/maple-ingest" apps/ingest/dist/maple-ingest

            # BEFORE migrate: installs default privileges granting PUBLIC on every
            # table created from here on, so a new or rebuilt table can never land
            # owner-only and leave a consumer with "permission denied for table …".
            # Default privileges only apply to objects created after they are set,
            # hence the ordering. See packages/db/scripts/ensure-privileges.ts.
            - name: Ensure database privileges
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:ensure-privileges

            # Schema migrations run against the PlanetScale branch over the
            # DIRECT port (5432, never the PSBouncer/Hyperdrive poolers — DDL
            # through a transaction pooler misbehaves). MAPLE_PG_URL is the
            # single Infisical secret (direct 5432, admin role).
            - name: Run database migrations
              run: DATABASE_URL="$MAPLE_PG_URL" bun run --cwd packages/db db:migrate

            # AWS_ACCOUNT_ID: see the note in deploy-prd.yml.
            - name: Deploy STG stack with Alchemy
              id: deploy
              run: bun run alchemy:deploy:stg
              env:
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}

            # First pass of a stage with the AWS half on: the ingest ACM certificate
            # is created PENDING_VALIDATION and the 443 listener fails. Finish the
            # job here — create the validation CNAME in the Cloudflare zone with the
            # token Infisical already provides, wait for ISSUED, deploy again. A
            # deploy that failed for any other reason reaches this too: the script
            # is a no-op on an ISSUED certificate and the retry fails the same way.
            - name: Validate the ingest certificate and retry the deploy
              if: ${{ failure() && steps.deploy.outcome == 'failure' && env.MAPLE_DEPLOY_AWS_INGEST == '1' }}
              env:
                  INGEST_DOMAIN: ingest-staging.maple.dev
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
              run: |
                  bash scripts/ingest-cert-validate.sh
                  bun run alchemy:deploy:stg
