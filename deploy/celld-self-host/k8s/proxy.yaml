apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-pg-ws-proxy
  namespace: maple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maple-pg-ws-proxy
  template:
    metadata:
      labels:
        app: maple-pg-ws-proxy
    spec:
      containers:
        - name: proxy
          image: maple-pg-ws-proxy:dev
          envFrom:
            - configMapRef:
                name: maple-selfhost
          ports:
            - containerPort: 5498
---
apiVersion: v1
kind: Service
metadata:
  name: pg-ws-proxy
  namespace: maple
spec:
  selector:
    app: maple-pg-ws-proxy
  ports:
    - port: 5498
      targetPort: 5498
