apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-electric
  namespace: maple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maple-electric
  template:
    metadata:
      labels:
        app: maple-electric
    spec:
      enableServiceLinks: false
      containers:
        - name: electric
          image: electricsql/electric:latest
          env:
            - name: DATABASE_URL
              value: postgresql://maple:maple@postgres:5432/maple?sslmode=disable
            - name: ELECTRIC_INSECURE
              value: "true"
            - name: ELECTRIC_MANUAL_TABLE_PUBLISHING
              value: "true"
            - name: ELECTRIC_PORT
              value: "3000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: electric
  namespace: maple
spec:
  selector:
    app: maple-electric
  ports:
    - port: 3000
      targetPort: 3000
