apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maple-clickhouse
  namespace: maple
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-clickhouse
  namespace: maple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maple-clickhouse
  template:
    metadata:
      labels:
        app: maple-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.2
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: maple
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-selfhost
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - containerPort: 8123
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maple-clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: maple
spec:
  selector:
    app: maple-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
