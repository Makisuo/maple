apiVersion: v1
kind: ConfigMap
metadata:
  name: maple-otel
  namespace: maple
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 5000
        send_batch_max_size: 10000
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
    exporters:
      maple:
        endpoint: http://clickhouse:8123
        database: default
        username: maple
        password: ${env:MAPLE_CLICKHOUSE_PASSWORD}
        org_id: default
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 5000
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [maple]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [maple]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [maple]
      telemetry:
        logs:
          level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-otel
  namespace: maple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maple-otel
  template:
    metadata:
      labels:
        app: maple-otel
    spec:
      containers:
        - name: otel
          image: maple-otel:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MAPLE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maple-selfhost
                  key: CLICKHOUSE_PASSWORD
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: maple-otel
---
apiVersion: v1
kind: Service
metadata:
  name: otel
  namespace: maple
spec:
  selector:
    app: maple-otel
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
