apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-sync
  namespace: maple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maple-sync
  template:
    metadata:
      labels:
        app: maple-sync
    spec:
      containers:
        - name: celld
          image: maple-celld:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CELLD_APP_DIR
              value: /app/apps/electric-sync
            - name: CELLD_PORT
              value: "3476"
            - name: CELLD_BUCKET
              value: s3://maple-celld/sync
            - name: CELLD_VARS_FILE
              value: /run/maple/celld-vars.env
            - name: CELLD_WATCH
              value: /var/lib/celld
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: maple-minio
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: maple-minio
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: RUST_LOG
              value: warn
          volumeMounts:
            - name: vars
              mountPath: /run/maple
          ports:
            - containerPort: 3476
      volumes:
        - name: vars
          secret:
            secretName: maple-selfhost
            items:
              - key: CELLD_VARS
                path: celld-vars.env
---
apiVersion: v1
kind: Service
metadata:
  name: sync
  namespace: maple
spec:
  selector:
    app: maple-sync
  ports:
    - port: 3476
      targetPort: 3476
