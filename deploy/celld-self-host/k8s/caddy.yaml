apiVersion: v1
kind: ConfigMap
metadata:
  name: maple-caddy
  namespace: maple
data:
  Caddyfile: |
    :80 {
      encode gzip
      handle /health { reverse_proxy api:3472 }
      handle /.well-known/celld/* { reverse_proxy api:3472 }
      handle /v2/* { reverse_proxy api:3472 }
      handle /internal/* { reverse_proxy api:3472 }
      handle /api/sync/* { reverse_proxy sync:3476 }
      handle /api/* { reverse_proxy api:3472 }
      handle /v1/* { reverse_proxy otel:4318 }
      handle { reverse_proxy web:80 }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-caddy
  namespace: maple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maple-caddy
  template:
    metadata:
      labels:
        app: maple-caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2.10-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: caddyfile
          configMap:
            name: maple-caddy
---
apiVersion: v1
kind: Service
metadata:
  name: maple
  namespace: maple
spec:
  selector:
    app: maple-caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
