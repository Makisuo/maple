<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
<head>
<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
<meta name="x-apple-disable-message-reformatting">
<style>@tailwind utilities;</style>
</head>
<body style="background-color:#141210;margin:0;padding:0">
<div style="display:none;overflow:hidden;line-height:1px;opacity:0;max-height:0;max-width:0">[[previewText]]<div>[[#preheaderPad]]</div></div>
<table border="0" width="100%" cellpadding="0" cellspacing="0" role="presentation" align="center"><tbody><tr><td class="m-0 bg-maple-bg px-4 py-10 font-mono">
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" class="mx-auto max-w-[560px] overflow-hidden rounded-xl border border-solid border-maple-border bg-maple-surface"><tbody><tr style="width:100%"><td>

<!-- Header -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" class="px-6 pb-5 pt-6"><tbody><tr><td>
	<table class="w-full"><tbody><tr>
		<td class="w-[36px] pr-3 align-middle">
			<table cellpadding="0" cellspacing="0" role="presentation"><tbody><tr>
				<td style="width:32px;height:32px;background-color:#e8872a;border-radius:8px;text-align:center;vertical-align:middle;font-family:system-ui, -apple-system, sans-serif;font-size:18px;font-weight:700;color:#ffffff;line-height:32px">M</td>
			</tr></tbody></table>
		</td>
		<td class="align-middle">
			<p class="m-0 font-mono text-base font-semibold text-maple-fg">Maple Alerts</p>
			<p class="m-0 mt-0.5 font-mono text-xs text-maple-fg-muted">Alert notification</p>
		</td>
	</tr></tbody></table>
</td></tr></tbody></table>

<!-- Accent divider -->
<div class="mx-6 h-px bg-maple-border" style="background-image:linear-gradient(to right, [[accentColor]], #3a342e 40%)"></div>

<!-- Event banner -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" class="px-5 pt-5"><tbody><tr><td>
	<div style="border-left:3px solid [[accentColor]];background-color:#262320;border-top-right-radius:8px;border-bottom-right-radius:8px;padding:14px 16px">
		<span style="display:inline-block;background-color:[[accentColor]];color:#ffffff;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">[[eventLabel]]</span>
		<p class="m-0 mt-2.5 font-mono text-[15px] font-semibold leading-snug text-maple-fg">[[eventEmoji]] [[ruleName]]</p>
		<p class="m-0 mt-1 font-mono text-[12px] leading-snug text-maple-fg-muted">[[observedSummary]]</p>
	</div>
</td></tr></tbody></table>

<!-- Details -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" class="px-6 pt-5"><tbody><tr><td>
	<div class="overflow-hidden rounded-lg border border-solid border-maple-border-subtle bg-maple-card">
		<table class="w-full border-collapse"><tbody>
			<!--F:detailRow-->
			<tr>
				<td class="w-[110px] px-3 py-2.5 align-top" style="border-bottom:1px solid #302b26"><p class="m-0 font-mono text-[10px] uppercase leading-[24px] tracking-widest text-maple-fg-dim">[[label]]</p></td>
				<td class="px-3 py-2.5 align-top" style="border-bottom:1px solid #302b26"><p class="m-0 font-mono text-[13px] leading-snug" style="color:[[valueColor]]">[[value]]</p></td>
			</tr>
			<!--/F:detailRow-->
			<!--S:detailRows-->
		</tbody></table>
	</div>
</td></tr></tbody></table>

<!-- CTAs -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" class="px-6 pb-2 pt-6"><tbody><tr><td>
	<table class="w-full border-collapse"><tbody><tr>
		<td class="w-1/2 pr-1"><a href="[[linkUrl]]" target="_blank" class="block rounded-lg bg-maple-orange px-4 py-3 text-center font-mono text-sm font-semibold text-white no-underline">Open in Maple &rarr;</a></td>
		<td class="w-1/2 pl-1"><a href="[[chatUrl]]" target="_blank" class="block rounded-lg border border-solid border-maple-border bg-maple-card px-4 py-3 text-center font-mono text-sm font-semibold text-maple-fg no-underline">Ask Maple AI</a></td>
	</tr></tbody></table>
</td></tr></tbody></table>

<!-- Footer -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" class="px-6 pb-6 pt-3"><tbody><tr><td>
	<p class="m-0 text-center font-mono text-[11px] leading-[24px] text-maple-fg-dim">&#127809; Maple Alerts &middot; You are receiving this because this address is an alert destination for your organization.</p>
</td></tr></tbody></table>

</td></tr></tbody></table>
</td></tr></tbody></table>
</body>
</html>
